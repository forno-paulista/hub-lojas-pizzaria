<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Peça Forno Paulista</title>
<meta name="description" content="Escolha a unidade Forno Paulista mais perto de você e faça seu pedido.">
<meta name="theme-color" content="#86201B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --vinho: #86201B; --vinho-escuro: #5E1512; --fundo: #F4F4F5; --texto: #1D1D1F; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; font-family: Arial, sans-serif; color: var(--texto);
    background: var(--vinho-escuro);
  }
  main {
    max-width: 480px; margin: 0 auto; min-height: 100vh; padding: 16px 16px 24px;
    background: var(--vinho) url(textura-tijolos.png) repeat; background-size: 96px 48px;
    display: flex; flex-direction: column;
  }
  .topo { position: relative; }
  .capa { width: 100%; height: auto; aspect-ratio: 1; object-fit: cover; object-position: center 65%; border-radius: 20px; display: block; background: var(--vinho-escuro); }
  .topo::after { content: ""; position: absolute; inset: 55% 0 0; border-radius: 0 0 20px 20px; background: linear-gradient(transparent, rgba(0,0,0,.6)); }
  .logo { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); width: 140px; height: auto; z-index: 1; }
  h1 { color: #fff; font: 700 1.25rem/1.3 "Libre Baskerville", Georgia, serif; text-align: center; margin: 20px 0 16px; }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
  a.loja {
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    min-height: 60px; padding: 10px 24px; border-radius: 999px; background: #fff; color: var(--vinho);
    text-decoration: none; text-align: center; font: 700 1rem/1.3 "Libre Baskerville", Georgia, serif;
    transition: transform .1s, background-color .1s;
  }
  a.loja small { font: .8rem/1.3 Arial, sans-serif; color: #6B6B70; margin-top: 2px; }
  a.loja:hover { background: var(--fundo); }
  a.loja:active { transform: scale(.98); }
  a.loja:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  footer { margin-top: auto; padding-top: 28px; color: rgba(255,255,255,.8); font-size: .75rem; text-align: center; }
  @media (prefers-reduced-motion: reduce) { a.loja { transition: none; } }
</style>
</head>
<body>
<main>
  <div class="topo">
    <img class="capa" src="capa.jpg" alt="" width="900" height="900" fetchpriority="high">
    <img class="logo" src="logo-branca.png" alt="Forno Paulista Pizzaria" width="320" height="186">
  </div>
  <h1>Escolha sua unidade</h1>
  <ul id="lojas"></ul>
  <footer>Não usamos cookies nem coletamos dados pessoais. Contamos só os cliques por unidade.</footer>
</main>
<script src="lojas.js"></script>
<script>
  // Repassa todos os utm_* recebidos; sem eles, marca como acesso direto ao hub.
  const recebidos = new URLSearchParams(location.search);
  const utm = new URLSearchParams([...recebidos].filter(([k]) => k.startsWith('utm_')));
  if (!utm.has('utm_source')) utm.set('utm_source', 'hub');
  if (!utm.has('utm_medium')) utm.set('utm_medium', 'direto');

  const { rastreio, lojas } = CONFIG;
  const ul = document.getElementById('lojas');
  for (const loja of lojas) {
    const a = document.createElement('a');
    a.className = 'loja';
    a.href = `https://fornopaulista.tuigoapp.com.br/${encodeURIComponent(loja.slug)}/pedidos?${utm}`;
    a.textContent = loja.nome;
    if (loja.endereco) a.append(Object.assign(document.createElement('small'), { textContent: loja.endereco }));
    // keepalive: o registro sobrevive à troca de página; se falhar, o cliente segue para a loja igual.
    if (rastreio) a.addEventListener('click', () => {
      const q = new URLSearchParams({ tipo: 'clique', campanha: utm.get('utm_campaign') || 'sem_campanha', loja: loja.slug });
      fetch(`${rastreio}?${q}`, { keepalive: true, mode: 'no-cors' }).catch(() => {});
    });
    const li = document.createElement('li');
    li.append(a);
    ul.append(li);
  }
</script>
</body>
</html>
